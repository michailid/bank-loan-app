<div class="container-fluid register-wrapper">
  <div class="row min-vh-100">
    <!-- Left Form Panel -->
    <div
      class="col-lg-6 form-panel d-flex align-items-center justify-content-center order-2 order-lg-1"
    >
      <div class="form-panel-inner">
        <div class="icon-circle">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="form-title">Create Your Account</h1>
        <p class="form-subtitle">Join us and start your loan application journey</p>

        <form>
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-id-badge"></i></span>
              <input
                type="text"
                class="form-control"
                id="fullName"
                placeholder="Enter your full name"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Choose a username"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Create a strong password"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="Confirm your password"
              />
            </div>
          </div>

          <div class="form-check terms-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms" />
            <label class="form-check-label" for="terms">
              I agree to the <a href="#">Terms &amp; Conditions</a>
            </label>
          </div>

          <button type="submit" class="btn btn-create-account w-100">
            <i class="fa-solid fa-user-plus me-2"></i>Create Account
          </button>

          <p class="login-link">Already have an account? <a href="#">Login Here</a></p>
        </form>
      </div>
    </div>

    <!-- Right Info Panel -->
    <div class="col-lg-6 info-panel order-1 order-lg-2">
      <div class="info-panel-inner">
        <div class="shield-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="info-title">Secure &amp; Reliable</h2>
        <p class="info-subtitle">Your information is protected with bank-level security</p>

        <ul class="feature-list">
          <li><i class="fa-solid fa-circle-check"></i> 256-bit Encryption</li>
          <li><i class="fa-solid fa-circle-check"></i> Data Privacy Compliant</li>
          <li><i class="fa-solid fa-circle-check"></i> Trusted by Thousands</li>
        </ul>
      </div>
    </div>
  </div>
</div>
